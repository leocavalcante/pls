name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            name: pls-linux-x64
          - target: bun-linux-arm64
            name: pls-linux-arm64
          - target: bun-darwin-arm64
            name: pls-darwin-arm64
          - target: bun-darwin-x64
            name: pls-darwin-x64
          - target: bun-windows-x64
            name: pls-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build ${{ matrix.name }}
        run: |
          cd packages/server
          bun build --compile --minify --target=${{ matrix.target }} ./index.ts --outfile dist/${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: packages/server/dist/${{ matrix.name }}

  build-vscode:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux-x64
            binary: pls-linux-x64
          - platform: linux-arm64
            binary: pls-linux-arm64
          - platform: darwin-x64
            binary: pls-darwin-x64
          - platform: darwin-arm64
            binary: pls-darwin-arm64
          - platform: win32-x64
            binary: pls-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: packages/vscode/server

      - name: Rename binary to platform convention
        run: |
          cd packages/vscode/server
          if [[ "${{ matrix.platform }}" == "win32-x64" ]]; then
            mv ${{ matrix.binary }} pls-win32-x64.exe
          elif [[ "${{ matrix.platform }}" == "darwin-x64" ]]; then
            mv ${{ matrix.binary }} pls-darwin-x64
            chmod +x pls-darwin-x64
          elif [[ "${{ matrix.platform }}" == "darwin-arm64" ]]; then
            mv ${{ matrix.binary }} pls-darwin-arm64
            chmod +x pls-darwin-arm64
          elif [[ "${{ matrix.platform }}" == "linux-x64" ]]; then
            mv ${{ matrix.binary }} pls-linux-x64
            chmod +x pls-linux-x64
          elif [[ "${{ matrix.platform }}" == "linux-arm64" ]]; then
            mv ${{ matrix.binary }} pls-linux-arm64
            chmod +x pls-linux-arm64
          fi
          ls -la

      - name: Build VS Code extension
        run: |
          cd packages/vscode
          bun run build

      - name: Package VS Code extension for ${{ matrix.platform }}
        run: |
          cd packages/vscode
          bunx @vscode/vsce package --no-dependencies --target ${{ matrix.platform }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: pls-vscode-${{ matrix.platform }}.vsix
          path: packages/vscode/*.vsix

  release:
    needs: [build, build-vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum pls-* *.vsix > SHA256SUMS
          cat SHA256SUMS

      - name: Get previous tag
        id: previous-tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "${{ steps.previous-tag.outputs.tag }}" ]]; then
            gh release create "${{ github.ref_name }}" \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes \
              --notes-start-tag "${{ steps.previous-tag.outputs.tag }}" \
              release-assets/*
          else
            gh release create "${{ github.ref_name }}" \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes \
              release-assets/*
          fi
