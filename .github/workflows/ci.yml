name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun --filter '*' test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            name: pls-linux-x64
          - target: bun-linux-arm64
            name: pls-linux-arm64
          - target: bun-darwin-arm64
            name: pls-darwin-arm64
          - target: bun-darwin-x64
            name: pls-darwin-x64
          - target: bun-windows-x64
            name: pls-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build ${{ matrix.name }}
        run: |
          cd packages/server
          bun build --compile --minify --target=${{ matrix.target }} ./index.ts --outfile dist/${{ matrix.name }}

      - name: Verify build
        if: matrix.target == 'bun-linux-x64'
        run: |
          chmod +x packages/server/dist/${{ matrix.name }}
          packages/server/dist/${{ matrix.name }} --version
          packages/server/dist/${{ matrix.name }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: packages/server/dist/${{ matrix.name }}
